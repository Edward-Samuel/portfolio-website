<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.2" r="1">
      <stop offset="0%" stop-color="#1a2436"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d3a55"/>
      <stop offset="100%" stop-color="#182233"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Abstract map grid -->
  <g stroke="rgba(108,99,255,0.10)" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="440" y1="0" x2="440" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- Route path -->
  <path d="M 90 280 Q 220 260 280 180 T 520 110" fill="none" stroke="url(#gate)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- GPS pin A -->
  <g transform="translate(90, 280)">
    <circle r="14" fill="#6c63ff" fill-opacity="0.2"/>
    <circle r="7" fill="#6c63ff"/>
    <circle r="3" cx="0" cy="-22" fill="#00d4ff"/>
  </g>

  <!-- GPS pin B -->
  <g transform="translate(520, 110)">
    <circle r="14" fill="#00d4ff" fill-opacity="0.2"/>
    <circle r="7" fill="#00d4ff"/>
    <circle r="3" cx="0" cy="-22" fill="#6c63ff"/>
  </g>

  <!-- Toll gate -->
  <g transform="translate(480, 60)">
    <rect x="-60" y="0" width="120" height="10" rx="5" fill="url(#gate)"/>
    <rect x="-55" y="10" width="10" height="70" rx="3" fill="#2d3a55"/>
    <rect x="45" y="10" width="10" height="70" rx="3" fill="#2d3a55"/>
    <rect x="-35" y="28" width="70" height="34" rx="4" fill="#0b0f19" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="0" y="48" fill="#e6edf3" font-size="12" font-family="Inter, sans-serif" font-weight="700" text-anchor="middle">TOLL</text>
  </g>

  <!-- Decorative labels -->
  <text x="320" y="320" fill="#8b949e" font-size="14" font-family="Inter, sans-serif" letter-spacing="0.1em" text-anchor="middle">GPS Toll-Based Simulation System</text>
  <text x="320" y="340" fill="#6c63ff" font-size="11" font-family="Inter, sans-serif" letter-spacing="0.05em" text-anchor="middle">Conceptual overview · Flask · Geopy · Folium · MySQL</text>
</svg>